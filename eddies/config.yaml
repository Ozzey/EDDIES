# Global defaults of Eddies.  Every experiment file in eddies/configs/experiments/ is merged on top
# of this file; dotted key=value overrides on the command line win over both.  The values below are
# the ones used for every number in the paper (sources in docs/CONFIGS.md).
seed: 0

paths:
  results: ${EDDIES_RESULTS:-results}                     # analysis JSON / NPZ shipped with the repo
  episodes: ${EDDIES_EPISODES:-datasets/episodes}         # MuJoCo episode logs (downloaded, not committed)
  episodes_isaac: ${EDDIES_RESULTS_ISAAC:-datasets/episodes_isaac}
  episodes_real: ${EDDIES_RESULTS_REAL:-datasets/episodes_real}
  models: ${EDDIES_MODELS:-results/tokprop}               # learned proposer .npz
  figures: assets/results/generated                       # where eddies.evaluate writes figures
  menagerie: ${EDDIES_MENAGERIE:-external/mujoco_menagerie}
  menagerie_commit: 0059d4335f8156206f63a35662313385f7ad6d74
  scratch: ${EDDIES_SCRATCH:-/tmp/eddies}
episode_layout: "{tag}/{condition}/{task}/{method}/seed_{seed:04d}"

robots: [franka, g1, leap, aero]                           # configs/robots/<name>.yaml, paper order
paper_tasks: [franka_fmb, franka_peg_insertion, franka_cube_stack, franka_drawer,
              g1_peg_insertion_sb, g1_drawer_sb, leap_wheel_sb, leap_peg_tighten_sb,
              aero_wheel_sb, aero_peg_tighten_sb]
franka_tasks: [franka_fmb, franka_peg_insertion, franka_cube_stack, franka_drawer]
method: bistl                                              # directory name of the Streamer's episodes

splits:                                                    # seeds, inclusive ranges
  train: [1000, 1199]                                      # identification (models, normalisers kappa)
  calib: [1200, 1399]                                      # conformal calibration (coverage level q)
  test: [2000, 2199]                                       # 200 test episodes per task
  test_extra: [2200, 2599]                                 # certify_task only, when present
  gate_test: [2000, 2099]                                  # "first 100 of the test episodes" (Franka gate, Table 1, Table 3)
  recal_split: 2050                                        # gate_fixed --recal: seeds < 2050 calibrate, >= 2050 test
  isaac: {train: [1000, 1049], calib: [1200, 1249], test: [2000, 2049]}
  real: {train: [0, 49], calib: [50, 99], test: [100, 149]}

conformal:
  alpha: 0.1                                               # miscoverage of the episode-level envelope
  kappa_quantile: 0.9                                      # per-Eddie normaliser: quantile of training episode-max residuals

identification:
  order: 1
  ridge: 1.0e-6                                            # lam = ridge * trace(G) / n  (unshrunk fits)
  shrink_grid: [0.0, 0.03, 0.3, 3.0]                       # lam = shrink * n_transitions toward the reference model
  select: min_train_tube                                   # per label: smallest estimated tube on the training split
  reference: {min_transitions: 5000, fallback_fraction: 0.5}
  min_train_transitions: 50                                # fewer -> the Eddie is left uncertified
  min_std: 0.01                                            # coordinates that never move are not certified
  max_spectral_radius: 0.999                               # >= -> uncertified (tube)
  horizon: 4000                                            # steps of the propagated tube

gate:                                                      # fixed-calibration certify-or-stop
  mu_cm: [2, 3, 5, 7.5, 10, 15]
  speed_scales: [1.0, 1.5, 2.0, 3.0, 4.0]

adaptive_gate:                                             # self-calibrating gate (online conformal)
  eta: 0.5
  lam0: {eddie: 200.0, primitive: 50.0, global: 10.0}      # prior weight [transitions] by prior level
  kappa_min_episodes: 5
  h_max_steps: 600
  max_spectral_radius: 0.995
  lookahead: 0

smoke: {per_split: 40, n_test: 20}                         # --smoke slices of the analysis scripts

sim:                                                       # eddies.envs defaults (task classes may override)
  physics_dt: 0.002
  control_dt: 0.02
  horizon_s: 60.0
  success_hold_s: 1.0
  failure_budget: 2
  rho_step: 0.012
  rho_game: 10.0
  formula: "G !bad"
  physics: {integrator: implicitfast, iterations: 100, ls_iterations: 50, noslip_iterations: 0,
            cone: elliptic, impratio: 10.0, air: true}
  video: {fps: 30, width: 1920, height: 1080}

collect:
  conditions: [nominal, perturbed]
  workers: 20
  max_tasks_per_child: 10

skillbook:
  alpha_share: 0.08333333333333333                         # 1/12 of alpha per primitive (vocabulary growth)

plots:
  colors: {navy: "#221b45", arrow: "#2e4b6c", grid: "#e6eaf0", blue: "#2e90ef", orange: "#f39a2b",
           violet: "#6a1fd6", grey: "#9aa3b2", panel: "#f3f9fe", stop: "#d6452b", move: "#c9d6e3"}
  font: {family: "DejaVu Sans", size: 7.5}
